  confirm button is disabled). SVG path data and a third-party extension
  attribute (bis_skin_checked) were stripped; nothing else changed.

     only by classes (Sell: "bg-red-transparent text-red", Buy: "bg-green-transparent text-green",
     inactive: "bg-bg-secondary … text-text-secondary"). No aria-selected/data-state.
   - Amount box is <input placeholder="0"> with NO type/inputmode, in USD ("$" prefix).
   - Sell presets: 10% 25% 50% 100% (no "Max").
   - Confirm is a <button> labelled "Sell <SYMBOL>"; when the amount is too big its label
     becomes "Insufficient balance".
   - "Swap settings" gear sits in the tab row.
-->
