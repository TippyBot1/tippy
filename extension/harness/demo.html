<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bonkle · demo</title>
    <style>
      @font-face {
        font-family: 'Onest';
        src: url('/fonts/Onest-Variable.latin.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Martian Mono';
        src: url('/fonts/MartianMono-Variable.latin.woff2') format('woff2');
        font-weight: 100 800;
        font-stretch: 75% 112.5%;
      }
      :root {
        --bg: #07060f;
        --panel: #100f19;
        --line: rgba(203, 208, 235, 0.09);
        --text: #f4f4f7;
        --muted: #8e8f9c;
        --up: #21c95e;
        --down: #ff5a36;
        --sans: 'Onest', system-ui, sans-serif;
        --mono: 'Martian Mono', ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 500 14px var(--sans);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      .page {
        display: grid;
        grid-template-columns: 1fr 336px;
        grid-template-rows: auto 1fr;
        gap: 14px;
        height: 100%;
        padding: 18px 18px 18px 22px;
      }
      header {
        grid-column: 1 / 2;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .avatar {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        flex: none;
      }
      .name {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .name b {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .name span {
        color: var(--muted);
        font-size: 13px;
      }
      .pill {
        margin-left: 6px;
        padding: 4px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font: 600 10.5px var(--sans);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .stats {
        display: flex;
        gap: 10px;
        margin-left: auto;
      }
      .stat {
        min-width: 112px;
        padding: 9px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
      }
      .stat small {
        display: block;
        margin-bottom: 3px;
        color: var(--muted);
        font-size: 11.5px;
      }
      .stat b {
        font: 600 15px var(--mono);
        font-stretch: 87.5%;
        font-variant-numeric: tabular-nums;
      }
      .stat.big b {
        font-size: 19px;
      }
      .up {
        color: var(--up);
      }
      .down {
        color: var(--down);
      }
      .chart {
        position: relative;
        grid-column: 1 / 2;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        overflow: hidden;
      }
      .chart canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .tf {
        position: absolute;
        top: 12px;
        left: 14px;
        display: flex;
        gap: 4px;
        z-index: 1;
      }
      .tf span {
        padding: 5px 9px;
        border-radius: 7px;
        color: var(--muted);
        font: 600 12px var(--sans);
      }
      .tf span.on {
        background: rgba(255, 255, 255, 0.07);
        color: var(--text);
      }
      aside {
        grid-column: 2;
        grid-row: 1 / 3;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .stat.bag b + b {
        margin-left: 6px;
        font-size: 13px;
      }
      .stat.sold {
        display: none;
        border-color: rgba(33, 201, 94, 0.45);
        background: rgba(33, 201, 94, 0.08);
      }
      .stat.sold.on {
        display: block;
      }
      .stat.sold b {
        color: var(--up);
      }
      .bag-old {
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
      }
      .bag small {
        color: var(--muted);
        font-size: 12px;
      }
      .bag .v {
        margin-top: 6px;
        font: 600 26px var(--mono);
        font-stretch: 87.5%;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      .bag .row {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        color: var(--muted);
        font: 500 12.5px var(--mono);
        font-stretch: 87.5%;
      }
      .bag .row b {
        font-weight: 600;
      }
      .sold-old {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        color: var(--up);
        font: 600 12.5px var(--mono);
        font-stretch: 87.5%;
        display: none;
      }
      .sold-old.on {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <svg class="avatar" viewBox="0 0 46 46" aria-hidden="true">
          <defs>
            <radialGradient id="av" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffb347" /><stop offset="1" stop-color="#f0702b" /></radialGradient>
          </defs>
          <circle cx="23" cy="23" r="23" fill="url(#av)" />
          <path d="M9 14 Q8 5 15 8 L18 15Z M37 14 Q38 5 31 8 L28 15Z" fill="#c4531c" />
          <ellipse cx="23" cy="27" rx="13" ry="11" fill="#ffe2bf" />
          <circle cx="17.5" cy="22" r="2.6" fill="#1b1424" />
          <circle cx="28.5" cy="22" r="2.6" fill="#1b1424" />
          <circle cx="18.3" cy="21.2" r="0.9" fill="#fff" />
          <circle cx="29.3" cy="21.2" r="0.9" fill="#fff" />
          <ellipse cx="23" cy="28" rx="3.2" ry="2.2" fill="#1b1424" />
          <path d="M19 32 Q23 35.5 27 32" stroke="#1b1424" stroke-width="1.6" fill="none" stroke-linecap="round" />
        </svg>
        <div class="name"><b>Bonkle</b><span>$BONKLE · Solana</span></div>
        <span class="pill">Demo coin</span>
        <div class="stats">
          <div class="stat big"><small>Market cap</small><b id="s-mc">$420K</b></div>
          <div class="stat"><small>Price</small><b id="s-price">$0.00042</b></div>
          <div class="stat"><small>24h</small><b id="s-24h" class="up">+182%</b></div>
          <div class="stat bag"><small>Your bag · bought at $300K</small><b id="b-usd">$105.00</b> <b id="b-pnl" class="up">+40.0%</b></div>
          <div class="stat sold" id="b-soldbox"><small>Tippy cashed out</small><b id="b-sold">$0.00</b></div>
        </div>
      </header>
      <div class="chart">
        <div class="tf"><span>1s</span><span class="on">1m</span><span>5m</span><span>1h</span><span>1d</span></div>
        <canvas id="chart"></canvas>
      </div>
    </div>
    <div id="tippy"></div>
    <script type="module" src="./main.tsx"></script>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
